server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 🔥 ۱. استفاده از DNS داخلی داکر
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        # 🔥 ۲. تعریف آدرس به صورت متغیر (این کار حل DNS را به زمان دریافت درخواست موکول می‌کند)
        set $api_upstream http://api:8080;
        
        # 🔥 ۳. استفاده از متغیر در proxy_pass (بدون اضافه کردن /api/ در انتها)
        # وقتی URI در proxy_pass نباشد، Nginx خودکار مسیر درخواست شده (مثلاً /api/users) را به انتهای آن می‌چسباند
        proxy_pass $api_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}